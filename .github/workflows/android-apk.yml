name: Android ARM64 clean-room APK
on:
  push:
    branches: [android]
  pull_request:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android toolchains
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Generate clean-room resource pack
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check numpy pillow
          python3 native/tools/generate_cleanroom_resources.py generated/cleanroom
          mkdir -p app/src/main/assets
          cp generated/AirXonix-cleanroom.zip app/src/main/assets/AirXonix-cleanroom.zip
      - name: Install matched SDL2 C, JNI and Java sources
        run: bash scripts/prepare_sdl2.sh
      - name: Build debug APK (ARM64)
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AirXonix-r373-Android-ARM64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
