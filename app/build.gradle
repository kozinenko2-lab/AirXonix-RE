plugins { id 'com.android.application' }
android {
    namespace 'com.airxonix.nativeport'
    compileSdk 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId 'com.airxonix.nativeport'
        minSdk 26
        targetSdk 34
        versionCode 373
        versionName '0.373-android-isolated-controls' 
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static',
                '-DAIRXONIX_BUILD_RUNTIME=ON', '-DAIRXONIX_BUILD_TESTS=OFF',
                '-DAIRXONIX_RESOURCE_FREE=ON' }
        }
    }
    buildTypes { debug { debuggable true }
                 release { minifyEnabled false } }
    externalNativeBuild { cmake { path file('../CMakeLists.txt'); version '3.22.1' } }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
    packaging { jniLibs { useLegacyPackaging true } }
}
